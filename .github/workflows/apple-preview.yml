name: Apple preview packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or release tag
        default: main
        required: true

permissions:
  contents: read

jobs:
  desktop-and-watch:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Verify shared store upgrade and timed programs
        run: |
          mkdir -p "$RUNNER_TEMP/lianji-check/module-cache"
          cp assets/plans/training-programs.json assets/exercises/extra-exercises.json assets/exercises/breathing-profiles.json "$RUNNER_TEMP/lianji-check/"
          swiftc -module-cache-path "$RUNNER_TEMP/lianji-check/module-cache" apple/Shared/Models.swift apple/Shared/Breathing.swift apple/Shared/TrainingPrograms.swift apple/Shared/TrainingStore.swift scripts/verify-apple-programs.swift -o "$RUNNER_TEMP/lianji-check/verify"
          "$RUNNER_TEMP/lianji-check/verify"
      - name: Build macOS universal
        run: xcodebuild -project apple/LianjiApple.xcodeproj -scheme LianjiMac -configuration Release -destination 'generic/platform=macOS' -derivedDataPath apple-build CODE_SIGNING_ALLOWED=NO 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
      - name: Build watchOS simulator
        run: xcodebuild -project apple/LianjiApple.xcodeproj -scheme LianjiWatch -configuration Release -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' -derivedDataPath apple-build CODE_SIGNING_ALLOWED=NO
      - name: Verify and package
        run: |
          mkdir -p apple-artifacts
          python3 - <<'PY'
          import json, pathlib, plistlib
          root = pathlib.Path('apple-build/Build/Products')
          for folder, app in [('Release', 'LianjiMac.app'), ('Release-watchsimulator', 'LianjiWatch.app')]:
              target = root / folder / app
              resources = target / 'Contents/Resources' if app == 'LianjiMac.app' else target
              info = target / 'Contents/Info.plist' if app == 'LianjiMac.app' else target / 'Info.plist'
              assert plistlib.loads(info.read_bytes())['CFBundleShortVersionString'] == '1.2.0'
              assert len(json.loads((resources / 'training-programs.json').read_text())) == 34
              assert len(json.loads((resources / 'exercise-demos.json').read_text())) == 55
              assert len(json.loads((resources / 'breathing-profiles.json').read_text())) == 4
          PY
          ditto -c -k --sequesterRsrc --keepParent apple-build/Build/Products/Release/LianjiMac.app apple-artifacts/Lianji-1.2.0-macOS-universal.zip
          ditto -c -k --sequesterRsrc --keepParent apple-build/Build/Products/Release-watchsimulator/LianjiWatch.app apple-artifacts/Lianji-1.2.0-watchOS-Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: apple-desktop-watch-preview
          path: apple-artifacts/
          if-no-files-found: error
          retention-days: 7

  iphone-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate native project with Expo
        run: npx expo prebuild --platform ios --no-install --no-clean
      - name: Install native dependencies
        run: pod install --project-directory=ios
      - name: Build standalone simulator app
        run: |
          export NODE_BINARY="$(command -v node)"
          xcodebuild -workspace ios/app.xcworkspace -scheme app -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO
      - name: Verify and package
        run: |
          mkdir -p ios-artifacts
          python3 - <<'PY'
          import pathlib, plistlib
          app = pathlib.Path('ios-build/Build/Products/Release-iphonesimulator/app.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.allenwang.lianji'
          assert info['CFBundleShortVersionString'] == '1.2.0'
          assert (app / 'main.jsbundle').stat().st_size > 100000
          PY
          ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Release-iphonesimulator/app.app ios-artifacts/Lianji-1.2.0-iOS-Simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-preview
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 7
