name: Android APK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Published source tag or commit
        default: v1.1.0
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source
        run: |
          npm run lint
          npm run typecheck
          npm run test:templates
      - name: Generate Android project with Expo
        run: npx expo prebuild --platform android --no-install --no-clean
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify package and embedded bundle
        run: |
          mkdir -p apk-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk apk-artifacts/app-release.apk
          python3 - <<'PY'
          import json, pathlib, subprocess, zipfile
          apk = pathlib.Path('apk-artifacts/app-release.apk')
          with zipfile.ZipFile(apk) as bundle:
              assert bundle.testzip() is None
              assert bundle.getinfo('assets/index.android.bundle').file_size > 100000
          metadata = {
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'version': json.loads(pathlib.Path('package.json').read_text())['version'],
              'standalone': True,
              'signing': 'Temporary build signature; final signing is performed locally.'
          }
          pathlib.Path('apk-artifacts/build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-apk
          path: apk-artifacts/
          if-no-files-found: error
          retention-days: 7
