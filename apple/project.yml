name: LianjiApple
options:
  bundleIdPrefix: com.allenwang.lianji
  deploymentTarget:
    macOS: "14.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  LianjiMac:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Mac
      - path: ../assets/exercises
        buildPhase: resources
      - path: ../assets/plans
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenwang.lianji.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 练迹
        CODE_SIGN_STYLE: Automatic
    scheme: {}
  LianjiWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: ../assets/exercises
        buildPhase: resources
      - path: ../assets/plans
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allenwang.lianji.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 练迹
        INFOPLIST_KEY_WKWatchOnly: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
