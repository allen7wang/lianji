# This flow clears data only on the isolated CI emulator, never on a user device.
appId: com.allenwang.lianji
---
- launchApp:
    clearState: true
- assertVisible: "今天练什么？"
- tapOn:
    text: "计划"
    retryTapIfNoChange: true
- assertVisible: "训练计划"
- tapOn: "计划模板 · 34 套"
- tapOn: "间歇训练"
- scrollUntilVisible:
    element:
      text: ".*查看HIIT 全身模板.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*查看HIIT 全身模板.*"
- assertVisible: "4 组 × 20 秒"
- assertVisible: "休息 40 秒"
- takeScreenshot: hiit-preview
- tapOn: ".*添加整套计划 · 2 个训练日.*"
- assertVisible: "我的计划 5"
- scrollUntilVisible:
    element:
      text: "编辑HIIT 全身 · 全身 A"
    direction: DOWN
    timeout: 30000
- tapOn: "编辑HIIT 全身 · 全身 A"
- assertVisible: "编辑计划"
- takeScreenshot: timed-plan-editor
- tapOn: ".*保存计划.*"
- scrollUntilVisible:
    element:
      text: "我的计划 5"
    direction: UP
    timeout: 30000
- assertVisible: "我的计划 5"
- scrollUntilVisible:
    element:
      text: ".*开始训练.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ".*开始训练.*"
    index: 0
- assertVisible: "时长 · 秒"
- tapOn:
    text: ".*计时 20 秒.*"
    index: 0
- assertVisible: "动作计时.*"
- takeScreenshot: hiit-work-timer
- tapOn:
    text: "完成第 1 组"
    index: 0
- assertVisible: "组间休息.*"
- takeScreenshot: hiit-rest-timer
- tapOn: ".*结束训练.*"
- tapOn: "完成"
- assertVisible: "HIIT 全身 · 全身 [AB]"
- stopApp
- launchApp
- assertVisible: "今天练什么？"
- tapOn:
    text: "计划"
    retryTapIfNoChange: true
- assertVisible: "训练计划"
- assertVisible: "我的计划 5"
- tapOn: "计划模板 · 34 套"
- tapOn: "地面流动"
- scrollUntilVisible:
