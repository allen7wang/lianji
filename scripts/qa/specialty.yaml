      text: ".*查看动物流基础模板.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*查看动物流基础模板.*"
- assertVisible: "兽式支撑"
- assertVisible: "蟹式支撑"
- takeScreenshot: animal-flow-preview
- tapOn: ".*添加整套计划 · 2 个训练日.*"
- assertVisible: "我的计划 7"
- stopApp
- launchApp
- assertVisible: "今天练什么？"
