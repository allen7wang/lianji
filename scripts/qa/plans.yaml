# Run only on the isolated APK QA emulator, immediately after a fresh installation.
appId: com.allenwang.lianji
---
- launchApp
- tapOn: "计划"
- assertVisible: "训练计划"
- tapOn: "计划模板 · 12 套"
- tapOn: "居家训练"
- assertVisible: "居家哑铃全身.*"
- takeScreenshot: home-programs
- scrollUntilVisible:
    element:
      text: ".*查看居家哑铃全身模板.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*查看居家哑铃全身模板.*"
- assertVisible: ".*哑铃 A.*"
- assertVisible: ".*添加整套计划 · 2 个训练日.*"
- takeScreenshot: program-preview
- tapOn: ".*添加整套计划 · 2 个训练日.*"
- assertVisible: "我的计划 5"
- scrollUntilVisible:
    element:
      text: "居家哑铃全身 · 哑铃 A"
    direction: DOWN
    timeout: 30000
- takeScreenshot: imported-program
- stopApp
- launchApp
- tapOn: "计划"
- assertVisible: "训练计划"
- assertVisible: "我的计划 5"
- tapOn: "计划模板 · 12 套"
- tapOn: "居家训练"
- scrollUntilVisible:
    element:
      text: ".*查看居家哑铃全身模板.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*查看居家哑铃全身模板.*"
- assertVisible: ".*已添加到我的计划.*"
- takeScreenshot: repeat-import-preserved
